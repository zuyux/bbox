<svg xmlns="http://www.w3.org/2000/svg"
     width="256" height="256"
     viewBox="0 0 32 32"
     shape-rendering="crispEdges"
     role="img"
     aria-labelledby="title desc">
  <title id="title">Pixel Art Explorer Icon</title>
  <desc id="desc">Orange pixel-art compass icon on a transparent background.</desc>

  <!-- Outer compass frame -->
  <rect x="11" y="2" width="10" height="2" fill="#FF8A00"/>
  <rect x="7" y="4" width="18" height="2" fill="#FF8A00"/>
  <rect x="5" y="6" width="4" height="2" fill="#FF8A00"/>
  <rect x="23" y="6" width="4" height="2" fill="#FF8A00"/>
  <rect x="3" y="8" width="4" height="4" fill="#FF8A00"/>
  <rect x="25" y="8" width="4" height="4" fill="#FF8A00"/>
  <rect x="2" y="12" width="3" height="8" fill="#FF8A00"/>
  <rect x="27" y="12" width="3" height="8" fill="#FF8A00"/>
  <rect x="3" y="20" width="4" height="4" fill="#FF8A00"/>
  <rect x="25" y="20" width="4" height="4" fill="#FF8A00"/>
  <rect x="5" y="24" width="4" height="2" fill="#FF8A00"/>
  <rect x="23" y="24" width="4" height="2" fill="#FF8A00"/>
  <rect x="7" y="26" width="18" height="2" fill="#FF8A00"/>
  <rect x="11" y="28" width="10" height="2" fill="#FF8A00"/>

  <!-- Inner ring highlights -->
  <rect x="9" y="6" width="14" height="2" fill="#FFB347"/>
  <rect x="7" y="8" width="2" height="16" fill="#FFB347"/>
  <rect x="9" y="24" width="14" height="2" fill="#D95F00"/>
  <rect x="23" y="8" width="2" height="16" fill="#D95F00"/>

  <!-- Cardinal pixels -->
  <rect x="15" y="5" width="2" height="3" fill="#FFD08A"/>
  <rect x="15" y="24" width="2" height="3" fill="#A94300"/>
  <rect x="5" y="15" width="3" height="2" fill="#FFD08A"/>
  <rect x="24" y="15" width="3" height="2" fill="#A94300"/>

  <!-- Compass needle shadow -->
  <polygon points="16,8 20,16 16,24 14,17" fill="#A94300"/>

  <!-- Compass needle north -->
  <polygon points="16,7 19,16 16,14 13,16" fill="#FF8A00"/>
  <rect x="15" y="10" width="2" height="5" fill="#FFD08A"/>

  <!-- Compass needle south -->
  <polygon points="13,16 16,18 19,16 16,25" fill="#D95F00"/>
  <rect x="15" y="18" width="2" height="4" fill="#FFB347"/>

  <!-- Center pin -->
  <rect x="14" y="14" width="4" height="4" fill="#FF8A00"/>
  <rect x="15" y="15" width="2" height="2" fill="#FFF1D6"/>
</svg>
